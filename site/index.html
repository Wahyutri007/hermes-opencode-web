<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes Build Lab</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="hero">
<p class="eyebrow">HERMES + OPENCODE + DOCKER</p>
<h1>Dari instruksi menjadi website siap jalan.</h1>
<p>Hermes mengatur tugas, OpenCode menulis kode, Docker menjalankan hasilnya.</p>
<button id="runButton">Simulasikan build</button>
<ol id="steps">
<li data-step>Hermes menyusun tugas <span class="status">Menunggu</span></li>
<li data-step>OpenCode menulis file <span class="status">Menunggu</span></li>
<li data-step>Docker menjalankan web <span class="status">Menunggu</span></li>
</ol>
</main>
<script src="app.js"></script>
</body>
</html>
